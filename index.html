<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly Send</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0F7;--surface:#FFFFFF;--surface2:#ECE8F4;--ink:#1D1A2B;--muted:#6B6680;--line:#DDD8E8;
  --accent:#6D45D9;--accent-ink:#FFFFFF;--pink:#E0508C;--good:#1E9E6A;--bad:#D9443F;--ring-bg:#E6E2EF;
  --wall:#DCCBA9;--wall-line:#C7B189;--wall-dot:#A08A62;--shade:rgba(29,26,43,.5);
  --font:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14121C;--surface:#1E1B29;--surface2:#272336;--ink:#F1EEF8;--muted:#A49EB8;--line:#332E45;
  --accent:#A285FF;--accent-ink:#14121C;--pink:#F27AAE;--good:#3CCB8E;--bad:#FF6B66;--ring-bg:#2E2940;
  --wall:#5B4B36;--wall-line:#4B3E2C;--wall-dot:#382D1F;--shade:rgba(5,4,10,.7)}}
:root[data-theme="dark"]{
  --bg:#14121C;--surface:#1E1B29;--surface2:#272336;--ink:#F1EEF8;--muted:#A49EB8;--line:#332E45;
  --accent:#A285FF;--accent-ink:#14121C;--pink:#F27AAE;--good:#3CCB8E;--bad:#FF6B66;--ring-bg:#2E2940;
  --wall:#5B4B36;--wall-line:#4B3E2C;--wall-dot:#382D1F;--shade:rgba(5,4,10,.7)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100%}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;min-height:36px;transition:transform .08s}
button:active{transform:scale(.97)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink)}
button.chip{border-radius:999px;padding:5px 12px;min-height:32px;font-size:13.5px;font-weight:500}
button.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,textarea{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);min-width:0}
textarea{width:100%;resize:vertical;min-height:120px;line-height:1.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px 20px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:23px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px}
.weeklabel{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-left:auto}
.tabs button{border:none;background:transparent;min-height:32px;padding:5px 14px;border-radius:9px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;align-items:center;gap:6px}
.sync{font-size:12.5px;color:var(--muted)}
.layout{max-width:1320px;margin:0 auto;padding:0 20px 48px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,1fr);gap:20px;align-items:start}
.wallcol{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));height:calc(100vh - 110px);min-height:420px}
.wallbox{height:100%;border-radius:18px;overflow-y:auto;overflow-x:hidden;background:var(--wall);scrollbar-width:thin;position:relative}
.wallbox svg{display:block;width:100%;height:auto}
.wall-tag{position:absolute;left:8px;top:8px;font-size:12px;font-weight:700;background:var(--surface);border-radius:8px;padding:2px 8px;pointer-events:none;opacity:.92}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:14px}
.lvl{display:flex;align-items:center;gap:12px}
.lvl-num{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.lvl-sub{font-size:13px;color:var(--muted)}
.grade-badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 9px;border-radius:999px;font-weight:800;font-size:15px}
.xpbar{height:10px;background:var(--ring-bg);border-radius:999px;overflow:hidden;margin-top:6px}
.xpbar>div{height:100%;background:var(--accent);border-radius:999px;transition:width .6s ease}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px;flex-wrap:wrap}
.sec-head h2{font-size:18px;font-weight:700;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{border-color:var(--good)}
.card-top{display:flex;align-items:center;gap:12px}
.ring{width:58px;height:58px;flex:none}
.ring .fg{transition:stroke-dashoffset .6s ease,stroke .3s}
.card h3{font-size:16px;font-weight:700}
.count{font-size:13.5px;color:var(--muted)}
.card-top .ghost{margin-left:auto;font-size:13px;padding:4px 8px;min-height:30px}
.extra{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0}
.extra:empty{display:none}
.tag{background:var(--surface2);border-radius:999px;padding:2px 9px;color:var(--ink);font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.actions input{flex:1 1 120px}
.dots{display:flex;gap:5px}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted)}
.dot.on{background:var(--good);border-color:var(--good);color:#fff}
.dot.today{border-color:var(--ink)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.list h3{font-size:15px;font-weight:700}
.item{display:flex;gap:9px;align-items:flex-start;padding:4px 0;transition:opacity .35s,transform .35s}
.item.leaving{opacity:0;transform:translateX(12px)}
.tick{width:20px;height:20px;min-height:20px;padding:0;border-radius:6px;border:1.5px solid var(--muted);background:transparent;flex:none;margin-top:1px}
.tick:hover{border-color:var(--accent)}
.row{display:flex;gap:6px}
.row input{flex:1}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1.5px dashed var(--line);border-radius:14px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.file{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:4px 6px 4px 8px;font-size:13px;max-width:100%}
.file img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.file button{min-height:26px;padding:0 6px}
.posts{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.post-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.post-text{white-space:pre-wrap;line-height:1.6;max-width:70ch}
.post-media{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.post-media img{max-width:220px;max-height:220px;border-radius:10px;object-fit:cover}
.post-media a{color:var(--accent)}
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.week-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-head b{font-size:15px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface2)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.minibars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.minibar{height:5px;background:var(--ring-bg);border-radius:9px;margin-top:2px;overflow:hidden}
.minibar>div{height:100%;background:var(--accent)}
.totals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.overlay{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--surface);border-radius:20px;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:20px;position:relative}
.sheet h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.sheet .close{position:absolute;right:10px;top:10px}
.goal-row{display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.goal-row input{width:100%}
.log-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.celebrate{text-align:center}
.celebrate .big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:6px 0}
.celebrate img{width:100%;max-width:340px;border-radius:14px;margin:12px auto;display:block}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 10px 9px 16px;display:flex;gap:10px;align-items:center;z-index:70;font-size:14px;max-width:calc(100% - 24px)}
.toast button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent);min-height:30px;padding:3px 10px}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes puff{0%{opacity:.95;r:3}100%{opacity:0;r:12}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ptail{transform-origin:5px -40px;animation:sway 1.6s ease-in-out infinite}
.limb{transition:all .35s ease}
#climber{transition:transform .7s cubic-bezier(.3,.8,.3,1)}
#clInner{transform-origin:0 -10px}
#clInner.shake{animation:shake .5s ease-in-out 2}
#clInner.hop{animation:hop .45s ease-in-out 4}
.zz{animation:zz 2.4s ease-in-out infinite}
.zz2{animation-delay:1.2s}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding:0 12px 40px}
  .wallcol{order:-1;position:static;height:auto;min-height:0}
  .wallbox{height:150px;overflow-x:auto;overflow-y:hidden}
  .wallbox svg{width:auto;height:150px}
  .top{padding:12px 12px 10px}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
  .hero{grid-template-columns:auto minmax(0,1fr);gap:14px}
  .lvl-num{font-size:38px}
  .goal-row{grid-template-columns:1fr 90px}
  .goal-row .u{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 20 Q3 8 16 7 Q29 8 28 20 Q22 27 16 27 Q10 27 4 20Z" fill="#7F4FD8"/><path d="M5 20 Q16 26 27 20 Q22 28 16 28 Q10 28 5 20Z" fill="#4E2C93"/><circle cx="16" cy="16" r="3" fill="#4E2C93"/><circle cx="16" cy="16" r="1.4" fill="#1D1A2B"/></svg>Weekly Send</div>
  <div class="weeklabel" id="weekLabel"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="climb">Climb</button>
    <button role="tab" aria-selected="false" data-tab="journal">Journal</button>
    <button role="tab" aria-selected="false" data-tab="history">History</button>
  </nav>
  <div class="tools"><span class="sync" id="sync">Connecting</span><button id="authBtn" hidden>Sign in to sync</button><button class="ghost" id="muteBtn" aria-label="Sound on">🔊</button></div>
</header>

<div class="layout">
  <main>
    <section id="tab-climb">
      <div class="hero" id="hero"></div>
      <div class="sec-head"><h2>This week's goals</h2><div class="row"><button id="recapBtn">Week recap</button><button id="goalsBtn">Edit goals</button></div></div>
      <div class="cards" id="cards"></div>
      <div class="sec-head"><h2>Checklists</h2><div class="row"><button id="archiveBtn">Done archive</button></div></div>
      <div class="lists" id="lists"></div>
      <div class="row" style="margin-top:10px;max-width:520px"><input id="newList" placeholder="New list name, like Trip prep" aria-label="New list name"><button id="addListBtn">Add list</button></div>
    </section>

    <section id="tab-journal" hidden>
      <div class="sec-head"><h2 id="composerTitle">New journal post</h2><span class="weeklabel">+5 XP for your first post each day</span></div>
      <div class="composer">
        <textarea id="jText" placeholder="Best moment of the week was finally sending that orange problem at the gym..." aria-label="Journal text"></textarea>
        <div class="files" id="jFiles"></div>
        <div class="actions">
          <button id="attachBtn" hidden>Attach photos or files</button>
          <input type="file" id="fileInput" multiple hidden>
          <button id="fixBtn" hidden>Fix grammar</button>
          <button id="undoFixBtn" class="ghost" hidden>Undo fix</button>
          <span style="flex:1"></span>
          <button id="cancelEditBtn" class="ghost" hidden>Cancel</button>
          <button id="postBtn" class="primary">Post</button>
        </div>
      </div>
      <div class="posts" id="posts"></div>
    </section>

    <section id="tab-history" hidden>
      <div class="sec-head"><h2>All-time</h2><button id="shareBtn">Make share card</button></div>
      <div class="totals" id="totals"></div>
      <div class="sec-head"><h2>Past weeks</h2></div>
      <div class="weeks" id="weeks"></div>
    </section>
  </main>

  <aside class="wallcol" aria-label="Climbing wall progress">
    <div class="wallbox" id="wallBox">
      <div class="wall-tag" id="wallTag"></div>
      <svg id="wall" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climbing wall showing your level">
        <defs id="wallDefs"></defs>
        <g id="wallLayer"></g>
        <g id="fxLayer"></g>
        <g id="climber"></g>
      </svg>
    </div>
  </aside>
</div>

<datalist id="topics"></datalist>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
"use strict";
const TR=[
  {k:"reading",name:"Reading",icon:"📚",unit:"articles",one:"article",def:5,cap:1.5},
  {k:"research",name:"Research",icon:"🔬",unit:"hours",one:"hour",def:6,cap:1.5},
  {k:"sports",name:"Sports",icon:"🎾",unit:"hours",one:"hour",def:4,cap:1.5},
  {k:"fun",name:"Fun",icon:"🎉",unit:"sessions",one:"session",def:2,cap:1.5},
  {k:"duo",name:"Duolingo",icon:"🦉",unit:"days",one:"day",def:7,cap:1,fixed:true},
  {k:"typing",name:"Typing",icon:"⌨️",unit:"minutes",one:"minute",def:60,cap:1.5},
  {k:"family",name:"Call family",icon:"📞",unit:"calls",one:"call",def:2,cap:1.5}
];
const TRK=Object.fromEntries(TR.map(t=>[t.k,t]));
const SPORTS=["Tennis","Squash","Climb","Gym"];
const COLORS=[["#F5C518","#B48A06","#FCE58A"],["#E24B4A","#A32D2D","#F7C1C1"],["#3FAE49","#24702B","#A9DEAE"],["#7F4FD8","#4E2C93","#C7B3F0"],["#F08A24","#A85A0E","#F9C690"],["#2A2A2E","#0E0E10","#77777F"],["#2F7FE0","#18509A","#A7C9F3"],["#EC6FA6","#A93B6E","#F8C3DA"],["#F7F7F5","#B9B9B3","#FFFFFF"]];
const CNAMES=["Yellow","Red","Green","Purple","Orange","Black","Blue","Pink","White"];
const PATS=["solid","stripe","speck","glitter"];
const PAT_NAMES={solid:"",stripe:" striped",speck:" speckled",glitter:" glitter"};
const XPL=200;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const weekStartOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5);
const r1=n=>Math.round(n*10)/10;
const md=s=>parseYmd(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const gradeInfo=g=>{const ci=g%9,pt=PATS[Math.floor(g/9)%4];return{ci,pt,c:COLORS[ci],name:CNAMES[ci]+PAT_NAMES[pt],label:"V"+g}};
const darkText=ci=>[0,4,7,8].includes(ci);

/* ---------- storage ---------- */
const store={docs:new Map(),db:null,coll:null,mode:"loading",ready:false,queues:new Map(),pending:0};
const caps={assets:null,sample:null,downloads:null};
const LS="weekly-send-v1";
function getDoc(id){return store.docs.get(id)}
function setSync(t){$("#sync").textContent=t}
function syncLabel(){if(store.mode==="local")setSync("Saved on this device");else if(store.mode==="cloud")setSync(store.pending?"Saving":"Synced");}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(Object.fromEntries(store.docs)))}catch(e){}}
function persist(id,fn){store.pending++;syncLabel();const prev=store.queues.get(id)||Promise.resolve();const p=prev.then(fn).catch(e=>{if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete some old journal posts to free space.");else if(e&&e.code==="invalid_argument")toast("That change couldn't be saved.");else toast("Couldn't save. Check your connection.")}).finally(()=>{store.pending--;syncLabel()});store.queues.set(id,p)}
function writeDoc(id,data){store.docs.set(id,data);scheduleRender();persist(id,()=>store.coll?store.coll.doc(id).set(data):saveLocal())}
function deleteDoc(id){store.docs.delete(id);scheduleRender();persist(id,()=>store.coll?store.coll.doc(id).delete():saveLocal())}
function getState(){return getDoc("state")||{kind:"state"}}
function updateState(patch){const st=clone(getState());Object.assign(st,patch,{kind:"state"});writeDoc("state",st)}

/* ---------- XP engine ---------- */
function goalsFor(ws){const d=getDoc("w-"+ws);if(d&&d.goals)return d.goals;let best=null;for(const doc of store.docs.values()){if(doc.kind==="week"&&doc.ws<ws&&doc.goals&&(!best||doc.ws>best.ws))best=doc}return best?best.goals:Object.fromEntries(TR.map(t=>[t.k,t.def]))}
function weekStats(ws){
  const d=getDoc("w-"+ws);const goals=Object.assign({},goalsFor(ws),{duo:7});const logs=(d&&d.logs)||[];
  const sum={};TR.forEach(t=>sum[t.k]=0);const duoDays=new Set();
  for(const l of logs){if(l.t==="duo")duoDays.add(l.d);else if(sum[l.t]!=null)sum[l.t]+=Number(l.v)||0}

function renderCards(C){

function ensureWeek(ws){const d=clone(getDoc("w-"+ws));if(d){if(!d.goals)d.goals=goalsFor(ws);if(!d.logs)d.logs=[];return d}return{kind:"week",ws,goals:clone(goalsFor(ws)),logs:[]}}
function addLog(t,v,extra){
  Sound.get();const before=compute();const ws=before.cur;const today=ymd(new Date());
  if(t==="duo"&&before.curRec.s.duoDays.has(today)){toast("Duolingo is already done for today");return}
  const doc=ensureWeek(ws);const log=Object.assign({id:uid(),t,v:Number(v),d:today,ts:Date.now()},extra||{});doc.logs.push(log);
  const beforeP=before.curRec.s.pcts[t];
  writeDoc("w-"+ws,doc);
  const after=compute();const afterP=after.curRec.s.pcts[t];
  Sound.clap();climbStep();
  const leveled=after.level>before.level;
  if(!leveled&&beforeP!=null&&beforeP<1&&afterP>=1){setTimeout(()=>{Sound.cheer();cheer()},250);toast(`${TRK[t].name} goal complete!`,()=>removeLog(ws,log.id))}
  else toast(logLabel(log),()=>removeLog(ws,log.id));
}
function logLabel(l){const t=TRK[l.t];if(l.t==="duo")return"Duolingo done for today";if(l.wpm&&!l.v)return`Saved ${l.wpm} WPM`;return`Logged ${r1(l.v)} ${l.v===1?t.one:t.unit}${l.topic?` on ${l.topic}`:""}${l.sport?` of ${l.sport}`:""}${l.name?`: ${l.name}`:""}`}
function removeLog(ws,id){const d=clone(getDoc("w-"+ws));if(!d)return;d.logs=(d.logs||[]).filter(l=>l.id!==id);writeDoc("w-"+ws,d)}

function drawCard(C,headline){
  const cv=document.createElement("canvas");cv.width=1080;cv.height=1350;const x=cv.getContext("2d");const gi=gradeInfo(C.grade);const F="'Bricolage Grotesque', system-ui, sans-serif";
  x.fillStyle="#211640";x.fillRect(0,0,1080,1350);
  const r=rng(42);for(let i=0;i<70;i++){x.fillStyle=COLORS[Math.floor(r()*9)][0];x.globalAlpha=.16;x.beginPath();x.ellipse(r()*1080,r()*1350,14+r()*22,10+r()*14,r()*3,0,7);x.fill()}x.globalAlpha=1;
  x.save();x.translate(540,300);x.scale(9,9);const[a,b]=SHAPES.jug;x.fillStyle=gi.c[0];x.fill(new Path2D(a));
  if(gi.pt!=="solid"){x.save();x.clip(new Path2D(a));x.fillStyle=gi.ci===5?"#77777f":gi.c[1];x.globalAlpha=.7;if(gi.pt==="stripe"){for(let i=-30;i<30;i+=4){x.beginPath();x.moveTo(i,-12);x.lineTo(i+1.6,-12);x.lineTo(i+13.6,8);x.lineTo(i+12,8);x.fill()}}else{for(let i=0;i<40;i++){x.beginPath();x.arc(r()*26-13,r()*16-10,.5+r()*.6,0,7);x.fillStyle=gi.pt==="glitter"?(i%2?"#FFFFFF":"#FFE27A"):gi.c[1];x.fill()}}x.restore()}
  x.fillStyle=gi.c[1];x.fill(new Path2D(b));x.beginPath();x.arc(0,0,2.3,0,7);x.fill();x.fillStyle="#1D1A2B";x.beginPath();x.arc(0,0,1,0,7);x.fill();x.restore();
  x.textAlign="center";x.fillStyle=darkText(gi.ci)?"#1D1A2B":"#FFFFFF";x.font=`800 120px ${F}`;x.fillText(gi.label,540,300);
  x.fillStyle="#FFFFFF";x.font=`800 84px ${F}`;x.fillText(headline,540,520);
  x.font=`500 38px ${F}`;x.fillStyle="#D9CCFF";x.fillText(`Level ${C.level}, ${gi.name} holds, ${C.total} XP`,540,580);
  const t=C.tot;const items=[["Articles read",r1(t.reading)],["Research hours",r1(t.research)],["Sport hours",r1(t.sports)],["Fun sessions",r1(t.fun)],["Duolingo days",t.duo],["Typing minutes",r1(t.typing)],["Best WPM",C.best||"-"],["Family calls",r1(t.family)]];
  items.forEach(([k,v],i)=>{const cx=i%2?740:340,cy=700+Math.floor(i/2)*135;x.fillStyle="rgba(255,255,255,.08)";x.beginPath();if(x.roundRect)x.roundRect(cx-190,cy-62,380,112,22);else x.rect(cx-190,cy-62,380,112);x.fill();x.fillStyle="#FFFFFF";x.font=`800 54px ${F}`;x.fillText(String(v),cx,cy);x.fillStyle="#BFB3E6";x.font=`500 28px ${F}`;x.fillText(k,cx,cy+36)});
  const sp=Object.entries(t.sportBy).map(([k,v])=>`${k} ${r1(v)}h`).join("   ");if(sp){x.fillStyle="#EC6FA6";x.font=`500 30px ${F}`;x.fillText(sp,540,1270)}
  x.fillStyle="#8F84B8";x.font=`700 30px ${F}`;x.fillText(`Weekly Send, ${new Date().toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}`,540,1318);
  return cv;
}
async function shareModal(C,title,sub,big){
  try{await document.fonts.ready}catch(e){}
  const cv=drawCard(C,title);const url=cv.toDataURL("image/png");
  openModal(`<div class="celebrate">${big?`<div class="lvl-sub">${esc(sub)}</div><div class="big">${esc(title)}</div>`:`<h2>${esc(title)}</h2>`}<img src="${url}" alt="Share card with your climbing grade and totals"><div class="row" style="justify-content:center">${caps.downloads?`<button class="primary" id="saveImg">Save image</button>`:`<a href="${url}" download="weekly-send-V${C.grade}.png" style="background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none">Save image</a>`}<button data-close>Close</button></div></div>`);
  const sb=$("#saveImg");if(sb)sb.onclick=()=>cv.toBlob(async blob=>{try{await caps.downloads.save({filename:`weekly-send-V${C.grade}.png`,data:blob})}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the image. Long-press it instead.")}},"image/png");
}
function celebrate(C,gradeUp){
  if(gradeUp){Sound.roar();confetti(140);cheer();const gi=gradeInfo(C.grade);const newRound=C.grade>0&&C.grade%9===0;shareModal(C,`Sent ${gi.label}!`,newRound?`New pattern unlocked: ${PAT_NAMES[gi.pt].trim()} holds`:`You topped out and reached the ${gi.name.toLowerCase()} wall`,true)}
  else{Sound.cheer();confetti(50);cheer();openModal(`<div class="celebrate"><div class="lvl-sub">Level up</div><div class="big">Level ${C.level}</div><p class="count">She grabbed the next hold. ${5-(C.level%5)} more to the next grade.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="primary" data-close>Keep climbing</button></div></div>`);setTimeout(()=>{const s=$("#modalRoot .big");if(s&&s.textContent===`Level ${C.level}`)closeModal()},4500)}
}

/* ---------- render loop ---------- */
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  const C=compute();
  mood.sleepy=C.lastLogTs>0&&Date.now()-C.lastLogTs>48*3600e3;
  renderHero(C);renderCards(C);renderLists();renderPosts(C);renderHistory(C);renderWall(C);syncLabel();
  $("#muteBtn").textContent=getState().mute?"🔇":"🔊";$("#muteBtn").setAttribute("aria-label",getState().mute?"Sound off":"Sound on");
  if(store.ready)checkLevel(C);
}
function checkLevel(C){
  const st=getState();
  if(st.seenLevel==null){updateState({seenLevel:C.level});return}
  if(C.level>st.seenLevel){const gradeUp=Math.floor(C.level/5)>Math.floor(st.seenLevel/5);updateState({seenLevel:C.level});setTimeout(()=>celebrate(C,gradeUp),500)}
  else if(C.level<st.seenLevel)updateState({seenLevel:C.level});
}
function checkRecap(){
  const C=compute();const st=getState();const prev=addDays(C.cur,-7);const rec=C.weeks.find(w=>w.ws===prev);const now=new Date();
  if(rec&&(rec.s.hasLogs||rec.penalty)&&(st.recapSeen||"")<prev){updateState({recapSeen:prev});openModal(recapHtml(rec,"Last week's recap"))}
  else if(now.getDay()===0&&now.getHours()>=18&&(st.sundaySeen||"")<C.cur){updateState({sundaySeen:C.cur});openModal(recapHtml(C.curRec,"Sunday check-in"))}
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-overlay]");if(!b)return;
  if(b.matches("[data-overlay]")){if(e.target===b)closeModal();return}
  const d=b.dataset;
  if(d.tab){document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b?"true":"false"));["climb","journal","history"].forEach(t=>$("#tab-"+t).hidden=t!==d.tab);return}
  if(d.add){const k=d.add;const extra={};
    if(k==="research"){const tp=$("#in-topic").value.trim();if(tp)extra.topic=tp}
    if(k==="sports")extra.sport=UI.sport;
    if(k==="fun"){extra.name=$("#in-fun").value.trim()||"Fun session";$("#in-fun").value=""}
    addLog(k,d.v,extra);return}
  if(d.sport){UI.sport=d.sport;document.querySelectorAll("#sportPick .chip").forEach(x=>x.classList.toggle("on",x.dataset.sport===UI.sport));return}
  if(b.id==="wpmBtn"){const v=Math.round(Number($("#in-wpm").value));if(!v||v<1||v>300){toast("Enter your WPM, a number from 1 to 300");$("#in-wpm").focus();return}const before=compute().best;addLog("typing",0,{wpm:v});$("#in-wpm").value="";if(before>0&&v>before)setTimeout(()=>{toast(`New record, ${v} WPM! +20 XP`);Sound.cheer();cheer()},300);return}
  if(d.logs){openLogs(d.logs);return}
  if(d.dellog){removeLog(compute().cur,d.dellog);openLogs(UI.logsK);return}
  if(d.close!==undefined){closeModal();return}
  if(b.id==="goalsBtn")return openGoals();
  if(b.id==="saveGoals")return saveGoals();
  if(b.id==="recapBtn"){const C=compute();openModal(recapHtml(C.curRec,"This week so far"));return}
  if(b.id==="archiveBtn")return openArchive();
  if(b.id==="addListBtn")return addList();
  if(d.additem)return addItem(d.additem);
  if(d.tick){const[l,i]=d.tick.split("|");return tickItem(l,i)}
  if(d.restore){const[l,i]=d.restore.split("|");return restoreItem(l,i)}
  if(d.dellist){const x=getLists();x.lists=x.lists.filter(l=>l.id!==d.dellist);writeDoc("checklists",x);openArchive();return}
  if(b.id==="muteBtn"){updateState({mute:!getState().mute});if(getState().mute===false){Sound.get();Sound.clap()}return}
  if(b.id==="attachBtn")return $("#fileInput").click();
  if(d.rmfile!==undefined){J.files.splice(Number(d.rmfile),1);renderComposer();return}
  if(b.id==="fixBtn")return fixGrammar();
  if(b.id==="undoFixBtn"){if(J.prevText!=null){$("#jText").value=J.prevText;J.prevText=null;renderComposer()}return}
  if(b.id==="postBtn")return savePost();
  if(b.id==="cancelEditBtn"){J.editing=null;J.files=[];J.prevText=null;$("#jText").value="";renderComposer();return}
  if(d.editpost)return editPost(d.editpost);
  if(d.delpost)return deletePost(d.delpost);
  if(d.confirmdel)return confirmDelete(d.confirmdel);
  if(b.id==="shareBtn"){const C=compute();shareModal(C,`Climbing ${gradeInfo(C.grade).label}`,"",false);return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modalRoot").innerHTML)closeModal();
  if(e.key==="Enter"&&e.target.matches("input")){const id=e.target.id;if(id==="newList")addList();else if(id.startsWith("ni-"))addItem(id.slice(3));else if(id==="in-wpm")$("#wpmBtn").click();else if(id==="in-fun")document.querySelector('[data-add="fun"]').click();else if(id.startsWith("g-"))saveGoals()}
});
$("#fileInput").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";uploadFiles(f)});
$("#jText").addEventListener("input",()=>{if(J.prevText!=null){J.prevText=null;renderComposer()}});
window.matchMedia("(max-width:760px)").addEventListener("change",()=>{wallState.sig="";scheduleRender()});
setInterval(()=>{const C=compute();if(C.cur!==(window.__cw||C.cur)){scheduleRender();checkRecap()}window.__cw=C.cur},60000);

const FB_CONFIG={apiKey:"AIzaSyC1eJ28L72OxHOCAVxRAcyYF4bMPao9YW4",authDomain:"myclimbingwall-24dd4.firebaseapp.com",databaseURL:"https://myclimbingwall-24dd4-default-rtdb.firebaseio.com",projectId:"myclimbingwall-24dd4",storageBucket:"myclimbingwall-24dd4.firebasestorage.app",messagingSenderId:"537370039226",appId:"1:537370039226:web:6d80b2d9f746ac5b1bc383"};
let fbRef=null;
function loadLocalDocs(){try{return new Map(Object.entries(JSON.parse(localStorage.getItem(LS)||"{}")))}catch(e){return new Map()}}
function initFirebase(){
  try{firebase.initializeApp(FB_CONFIG)}catch(e){return}
  const auth=firebase.auth();const btn=$("#authBtn");btn.hidden=false;
  auth.getRedirectResult().catch(()=>{});
  btn.onclick=async()=>{
    if(auth.currentUser){if(confirm("Sign out on this device? Your progress stays saved in your account."))auth.signOut();return}
    const p=new firebase.auth.GoogleAuthProvider();
    try{await auth.signInWithPopup(p)}catch(e){const c=e&&e.code;if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")auth.signInWithRedirect(p);else if(c!=="auth/popup-closed-by-user"&&c!=="auth/cancelled-popup-request")toast("Sign-in didn't work. Try again.")}
  };
  auth.onAuthStateChanged(user=>{
    if(fbRef){fbRef.off();fbRef=null}
    if(!user){store.coll=null;store.mode="local";store.docs=loadLocalDocs();btn.textContent="Sign in to sync";btn.title="";listSig="";postSig="";scheduleRender();return}
    btn.textContent="Sign out";btn.title=user.email||"";
    const ref=firebase.database().ref("users/"+user.uid+"/docs");fbRef=ref;
    store.coll={doc:id=>({set:d=>ref.child(id).set(JSON.stringify(d)),delete:()=>ref.child(id).remove()})};
    store.mode="cloud";setSync("Connecting");let first=true;
    ref.on("value",snap=>{
      const m=new Map();snap.forEach(c=>{try{m.set(c.key,JSON.parse(c.val()))}catch(e){}});
      if(first){first=false;const local=loadLocalDocs();const up={};
        for(const[id,d]of local){if(!m.has(id)){up[id]=JSON.stringify(d);m.set(id,d)}}
        if(Object.keys(up).length)ref.update(up).then(()=>{try{localStorage.removeItem(LS)}catch(e){}toast("Moved your saved progress into your account")}).catch(()=>toast("Couldn't move your saved progress. Check your connection."));
        else{try{localStorage.removeItem(LS)}catch(e){}}
      }
      store.docs=m;listSig="";postSig="";scheduleRender();
    },()=>setSync("Sync error, sign in again"));
  });
}

/* ---------- boot ---------- */
buildCards();renderComposer();render();
(async function boot(){
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){}
    Promise.all([claude.use("assets").catch(()=>null),claude.use("sample").catch(()=>null),claude.use("downloads").catch(()=>null)]).then(([a,s,d])=>{caps.assets=a;caps.sample=s;caps.downloads=d;renderComposer()});
  }
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(db&&id){
    store.db=db;store.coll=db.collection("data/users/"+id);store.mode="cloud";
    store.coll.onSnapshot(snap=>{store.docs=new Map(snap.docs.map(d=>[d.id,clone(d.data())]));if(!store.ready){store.ready=true;listSig="";postSig="";render();checkRecap()}else scheduleRender()},()=>setSync("Sync paused, reload to reconnect"));
  }else{
    store.mode="local";try{const raw=JSON.parse(localStorage.getItem(LS)||"{}");store.docs=new Map(Object.entries(raw))}catch(e){}
    store.ready=true;listSig="";postSig="";render();checkRecap();
    if(window.firebase)initFirebase();
  }
})();
